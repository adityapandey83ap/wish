<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Coming Soon</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

html,body{
width:100%;
height:100%;
overflow:hidden;
}

body{
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#0f172a,#1e3a8a,#2563eb);
position:relative;
padding:20px;
}

/* Background Glow */

body::before{
content:"";
position:absolute;
width:320px;
height:320px;
background:#00d4ff;
border-radius:50%;
filter:blur(120px);
top:-100px;
left:-100px;
opacity:.45;
z-index:-1;
}

body::after{
content:"";
position:absolute;
width:320px;
height:320px;
background:#7c3aed;
border-radius:50%;
filter:blur(120px);
bottom:-100px;
right:-100px;
opacity:.45;
z-index:-1;
}

/* Glass Card */

.card{

width:100%;
max-width:650px;

padding:40px 30px;

text-align:center;

background:rgba(255,255,255,.12);

backdrop-filter:blur(20px);
-webkit-backdrop-filter:blur(20px);

border:1px solid rgba(255,255,255,.25);

border-radius:25px;

box-shadow:0 20px 50px rgba(0,0,0,.35);

color:white;

}

/* Badge */

.badge{

display:inline-block;

padding:10px 22px;

border-radius:40px;

background:rgba(255,255,255,.15);

border:1px solid rgba(255,255,255,.2);

letter-spacing:2px;

font-size:13px;

margin-bottom:20px;

}

/* Heading */

h1{

font-size:60px;

line-height:1;

margin-bottom:20px;

}

p{

font-size:20px;

line-height:1.7;

color:#eef2ff;

}

.line{

width:90px;

height:4px;

background:white;

margin:28px auto;

border-radius:10px;

}

.contact{

font-size:23px;

font-weight:bold;

}

.contact span{

color:#8cf8ff;

}

/* Liquid Clock */

.clock{

display:inline-block;

margin-top:35px;

padding:15px 35px;

background:rgba(255,255,255,.18);

backdrop-filter:blur(25px);

border:1px solid rgba(255,255,255,.25);

border-radius:50px;

box-shadow:
inset 0 2px 8px rgba(255,255,255,.25),
0 8px 25px rgba(0,0,0,.25);

font-size:28px;

font-weight:bold;

letter-spacing:4px;

animation:float 4s ease-in-out infinite;

}

@keyframes float{

0%,100%{

transform:translateY(0);

}

50%{

transform:translateY(-6px);

}

}

footer{

margin-top:30px;

font-size:13px;

color:#ddd;

}

/* Mobile */

@media(max-width:600px){

h1{

font-size:48px;

}

p{

font-size:18px;

}

.contact{

font-size:20px;

}

.clock{

font-size:22px;

padding:12px 28px;

}

}

</style>

</head>

<body>

<div class="card">

<div class="badge">

UPCOMING EVENT

</div>

<h1>

COMING<br>SOON

</h1>

<p>

We are preparing something exciting.<br>

Stay tuned for the official announcement.<br>

More details will be revealed soon.

</p>

<div class="line"></div>

<div class="contact">

For more information contact <span>Jay</span>

</div>

<div class="clock" id="clock">

00:00:00

</div>

</div>

<script>

function updateClock(){

const now=new Date();

const h=String(now.getHours()).padStart(2,"0");

const m=String(now.getMinutes()).padStart(2,"0");

const s=String(now.getSeconds()).padStart(2,"0");

document.getElementById("clock").textContent=h+":"+m+":"+s;

}

updateClock();

setInterval(updateClock,1000);

</script>

</body>
</html>
