<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>A Moment Worth Celebrating</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="ambient-background"></div>
    <canvas id="particle-canvas"></canvas>
    <div id="butterfly-container"></div>

    <main class="ui-container">
        <section class="glass-panel" id="main-panel">
            <span class="label slide-up-fade" style="--delay:1.2s">✨ A MOMENT WORTH CELEBRATING ✨</span>

            <h1 class="title cinematic-reveal" style="--delay:2s">Happy Anniversary</h1>

            <p class="subtitle slide-up-fade" style="--delay:3s">
                A little celebration is waiting for you...
            </p>

            <div id="countdown" class="countdown-timer slide-up-fade" style="--delay:3.5s">
                <div class="time-block"><span id="days">00</span><small>Days</small></div>
                <span class="separator">:</span>
                <div class="time-block"><span id="hours">00</span><small>Hours</small></div>
                <span class="separator">:</span>
                <div class="time-block"><span id="minutes">00</span><small>Mins</small></div>
                <span class="separator">:</span>
                <div class="time-block"><span id="seconds">00</span><small>Secs</small></div>
            </div>

            <div class="button-wrapper slide-up-fade" style="--delay:4.1s">
                <button id="open-btn" class="open-btn" type="button" aria-describedby="lock-status">
                    <span class="btn-heart">♥</span>
                    <span class="btn-text">ENTER THE MOMENT</span>
                    <span class="btn-heart">♥</span>
                    <span class="btn-glow"></span>
                </button>

                <div id="love-lock" class="love-lock" aria-hidden="true">
                    <div class="lock-shackle"></div>
                    <div class="lock-body"><span class="lock-keyhole">♥</span></div>
                    <div class="lock-aura"></div>
                </div>
            </div>

            <div id="divine-message" class="divine-message" aria-live="polite">
                <div class="message-sparkle">✦</div>
                <p id="message-main">Wait for the divine moment to come...</p>
                <span id="message-sub">Some moments are worth waiting for.</span>
            </div>

            <p id="lock-status" class="lock-status">The moment is still awaited.</p>
        </section>
    </main>

    <div id="transition-overlay"></div>

    <svg class="hidden-svg" aria-hidden="true">
        <symbol id="butterfly-wing" viewBox="0 0 100 100">
            <path d="M50,50 C30,10 0,20 10,60 C15,80 35,90 50,75 C65,90 85,80 90,60 C100,20 70,10 50,50 Z" />
        </symbol>
    </svg>

    <script src="script.js"></script>
</body>
</html>
